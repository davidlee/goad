[workspace]
resolver = "3"

# Enumerated, never a glob. A glob hides from a reader exactly what
# `goad-boundary` exists to make visible, and its own check fails on one
# (`Breach::GlobMember`, `design.md` §5.6). The order is the strata, then the
# member that is not one.
members = [
  "crates/goad-semantics",
  "crates/goad-shell",
  "crates/goad",
  "crates/goad-boundary",
]

[workspace.package]
version    = "0.1.0"
edition    = "2024"
license    = "MIT"
repository = "https://github.com/davidlee/goad"

# `publish = false` is not provisional: nothing here is meant for crates.io.
# It also silences `clippy::cargo_common_metadata` on its own — measured — which
# is why no member carries `description`, `keywords`, `categories` or `readme`:
# they would buy nothing and cost an unscanned surface (PL-11).
publish = false

# Versions and base feature sets live here; every member entry is
# `{ workspace = true }`, adding features where `design.md` §5.1's member table
# says so.
[workspace.dependencies]
goad-semantics = { path = "crates/goad-semantics" }
goad-shell     = { path = "crates/goad-shell" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
jiff       = { version = "0.2", default-features = false }
tokio      = { version = "1",
               features = ["process", "time", "rt", "io-util", "macros"] }

# Backend configuration parsing. The gating key it carried is gone with the
# `shell` feature it belonged to: that key is not meaningful in
# `[workspace.dependencies]`, and a member inheriting it would carry a
# dependency no feature can switch on (§5.6, PHASE-01/EX-9). `goad-boundary`
# takes it at PHASE-02, with the manifest allowlist that needs it.
toml       = { version = "1" }

# Pinned exactly, not a range: design.md §5.1 — A-1's twelve-lint list and
# A-3's `with_debug_info` change under a deliberate upgrade rather than a
# resolver drift. `i-slint-backend-testing` is "the Slint testing
# dev-dependency" S-8 names as one of the four permitted additions
# (`init_no_event_loop()` is defined there, not re-exported through `slint`
# itself — research.md Thread 3) and is pinned to the same version for the
# same reason.
slint                    = "=1.17.1"
slint-build              = "=1.17.1"
i-slint-backend-testing  = "=1.17.1"

# ---- Rust lints ----
[workspace.lints.rust]
# Absolute nasties.
#
# `warnings = "deny"` is deliberately NOT set here, and no `priority` trick
# recovers it: rustc applies the `warnings` pseudo-group over an explicit
# per-lint `--warn` whatever the order, so with it on, `warn` is not a reachable
# level and every lint below is deny-or-allow. Measured, not assumed.
#
# It is not lost, it moved: the clippy lines in `design.md` §9 pass
# `-D warnings`, so unenumerated warn-by-default lints still fail the phase
# gate. What changes is that they no longer fail every `cargo check` in the
# inner loop.

# `deny`, not `forbid`: `forbid` cannot be excepted at all, and an
# `#[expect(unsafe_code, reason = …)]` with a stated reason is reviewable and
# countable. Nothing in this crate is expected to need it.
unsafe_code = "deny"

# Public API hygiene.
# missing_docs paused: doc-comment absence is rarely the defect in agent code,
# and the tax slows exploratory work. Re-enable before publishing.
# missing_docs = "deny"
missing_debug_implementations = "deny"

# Dead/unused things should not survive agent iterations — with one carve-out.
#
# `dead_code` and `unreachable_pub` are transient *by construction* here: a
# phased plan lands a type one phase before its caller. At `deny` the only
# escape is peppering `#[cfg_attr(…, expect(dead_code, …))]` across a member.
# At `warn` the noise stays visible and the build still goes.
# `expect(dead_code, reason = …)` remains available for the cases worth
# *recording*; it self-clears via `unfulfilled_lint_expectations`.
#
# Both are left at their default `warn` explicitly rather than by omission, so
# that the carve-out is a decision on the page and not an oversight. It buys
# **nothing at the gate**: the gate is one column now, `cargo clippy --workspace
# --all-targets -- -D warnings`, and `-D warnings` promotes both back to errors
# there. The second column and its `-A dead_code -A unreachable_pub` are retired
# with the `shell` feature (`design.md` §5.6); what `warn` still buys is a
# `cargo check` in the inner loop that reports rather than stops.
#
# The rest of the group stays denied: `unused_imports`, `unused_variables`,
# `unused_mut`, `path_statements` have no legitimate transient case, and
# `unused_must_use` is a correctness lint wearing a tidiness costume.
unused = { level = "deny", priority = -1 }
dead_code = "warn"
# unused_crate_dependencies paused: false-positives on test/bench/feature-only
# deps; fights early scaffolding. Re-enable once the dep graph stabilises.
# unused_crate_dependencies = "deny"
unreachable_pub = "warn"

# Future-proofing / edition hygiene.
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

# Safety-sensitive.
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"

# Avoid accidental cfg drift.
unexpected_cfgs = "deny"

# ---- Clippy lints ----
[workspace.lints.clippy]
# Broad groups first, with lower priority so individual overrides below win.
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -2 }
# nursery dropped: the gate's `-D warnings` promotes it to hard error, and
# nursery lints are unstable/false-positive-prone. Re-add deliberately if you
# want that churn.
# nursery = { level = "warn", priority = -3 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Correctness / panic avoidance.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
integer_division = "deny"
# `arithmetic_side_effects` is NOT here, and that is deliberate. I9 wants it on
# the modules handling backend-derived data; crate-wide it fires on every loop
# counter. It stays a module-level `#![deny(…)]` per D53/R-46.

# Debug leftovers.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"

# Sloppy error handling.
map_err_ignore = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
# missing_errors_doc, missing_panics_doc and missing_safety_doc are pedantic
# lints, so `pedantic = "deny"` above already enables them — they are not paused
# with missing_docs, and the `# Errors` sections in the crate exist because they
# fire (F-12).

# Suspicious conversions / casts.
checked_conversions = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

# API/design pressure.
# `module_name_repetitions` is `allow`, and that is a decision rather than an
# omission — user decision 2026-08-29, PHASE-01. `design.md` §5.2 chooses
# `…Error` inside an `error` module as this crate's convention for the AC-6
# taxonomy: `ProtocolError`, `BoundsError` and `ScheduleError` in
# `semantics/error.rs`, and `BackendError` and `StateError` in `shell/error.rs`.
# The lint forbids that convention wholesale, so every error type in the design
# violates it by construction. An `#[expect(…, reason = …)]` per module was the
# alternative and was rejected as an instance fix for a class defect: §9 built
# that hatch for rare, individually argued exceptions like `unwrap_used`, not
# for a convention that is violated deliberately every time.
module_name_repetitions = "allow"
pub_use = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
default_trait_access = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"

# Performance and allocation discipline.
large_futures = "deny"
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
needless_pass_by_value = "deny"
redundant_clone = "deny"

# Async nastiness.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
future_not_send = "deny"
async_yields_async = "deny"

# Tests should not be garbage either.
tests_outside_test_module = "deny"
unwrap_in_result = "deny"

# Agent-hostile ambiguity.
shadow_unrelated = "deny"
same_name_method = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# Some pedantic lints are too noisy for most real projects.
must_use_candidate = "allow"
missing_const_for_fn = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
multiple_crate_versions = "allow"
