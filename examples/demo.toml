# The configuration `just demo` starts goad with.
#
# `command` is an argument vector, never a shell string — goad interposes no
# shell. Relative paths resolve against goad's working directory, which `just`
# sets to the repository root.
[backend]
command = ["bash", "examples/shell/backend.sh"]
timeout = "5s"

# The backend inherits this process's environment, which the demo backend uses
# for one knob of its own: `GOAD_DEMO_DELAY` holds its reply, in seconds.
#
#   GOAD_DEMO_DELAY=3 just demo    a window long enough to type into, drag
#                                  through, and watch — the host stays live
#                                  through an evaluation and disables the form
#                                  only while *your own answer* is in flight
#   GOAD_DEMO_DELAY=6 just demo    past the timeout above. Three things to
#                                  expect, because two of them read as defects
#                                  and are not:
#                                    - `no action taken: backend did not
#                                      respond within 5000ms` — the refusal,
#                                      on the diagnostic surface
#                                    - `cleanup unverified: …within 500ms` —
#                                      this backend's `sleep` is a *grandchild*
#                                      of the host holding inherited stderr, so
#                                      it outlives the `bash` the host kills.
#                                      The host's, not the backend's, and
#                                      bounded (`CLEANUP_LIMIT`)
#                                    - the reported next check jumps by
#                                      `default_poll` below, not by the delay:
#                                      a failed exchange accepts no instruction
#                                      and resolves as if none arrived
#                                      (SPEC-001/R-29, R-26's third branch).
#                                      The diagnostic surface shows only the
#                                      most recent frame, so what says the host
#                                      carried on is that it reports a next
#                                      check at all
#
# It is not a protocol feature. It is in the demo backend because the things
# worth watching here are host behaviours during an exchange, and an exchange
# that completes in milliseconds cannot be watched.

[schedule]
# Short on purpose: a person watching `GOAD_DEMO_DELAY=6` must see the host
# check *again* after a refusal, and at the 30 minutes a real configuration
# would use, the demo looks like it stopped. Above the 3 s minimum spacing
# (SPEC-002 §6), so nothing here is testing the floor.
default_poll = "30s"

# The event-ingress socket. With `just demo` running, emit an envelope from a
# second shell:
#
#   just emit reddit-watcher reddit-opened
#
# which is `goad-emit --socket ./goad-demo.sock --source … --kind …`. The
# `--socket` is not optional: emit discovers the host's *default*
# configuration path only, and the demo runs on an explicit one.
#
# The raw forms stay, because SPEC-003 is what a second implementation is held
# to and a worked example of the wire is worth more here than a shorter file
# (both terminated forms — `socat` by half-closing its write side after EOF,
# `nc` by the trailing newline — see SPEC-003/R-6):
#
#   printf '{"source":"reddit-watcher","kind":"reddit-opened","timestamp":"2026-08-22T17:10:00+10:00","data":{}}' \
#     | socat - UNIX-CONNECT:./goad-demo.sock
#
#   printf '{"source":"reddit-watcher","kind":"reddit-opened","timestamp":"2026-08-22T17:10:00+10:00","data":{}}\n' \
#     | nc -U ./goad-demo.sock
#
# The reply is one JSON line on the same connection. The socket lives in the
# checkout deliberately (D-17); `.gitignore` keeps it out of `git status`.
[ingress]
path = "./goad-demo.sock"
