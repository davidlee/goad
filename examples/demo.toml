# The configuration `just demo` starts goad with.
#
# `command` is an argument vector, never a shell string — goad interposes no
# shell. Relative paths resolve against goad's working directory, which `just`
# sets to the repository root.
[backend]
command = ["bash", "examples/shell/backend.sh"]
timeout = "5s"

[schedule]
default_poll = "30m"

# The event-ingress socket. With `just demo` running, emit an envelope from a
# second shell:
#
#   just emit reddit-watcher reddit-opened
#
# which is `goad-emit --socket ./goad-demo.sock --source … --kind …`. The
# `--socket` is not optional: emit discovers the host's *default*
# configuration path only, and the demo runs on an explicit one.
#
# The raw forms stay, because SPEC-003 is what a second implementation is held
# to and a worked example of the wire is worth more here than a shorter file
# (both terminated forms — `socat` by half-closing its write side after EOF,
# `nc` by the trailing newline — see SPEC-003/R-6):
#
#   printf '{"source":"reddit-watcher","kind":"reddit-opened","timestamp":"2026-08-22T17:10:00+10:00","data":{}}' \
#     | socat - UNIX-CONNECT:./goad-demo.sock
#
#   printf '{"source":"reddit-watcher","kind":"reddit-opened","timestamp":"2026-08-22T17:10:00+10:00","data":{}}\n' \
#     | nc -U ./goad-demo.sock
#
# The reply is one JSON line on the same connection. The socket lives in the
# checkout deliberately (D-17); `.gitignore` keeps it out of `git status`.
[ingress]
path = "./goad-demo.sock"
