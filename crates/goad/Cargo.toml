[package]
name                 = "goad"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
publish.workspace    = true
autotests            = false

# `crates/goad` names `jiff` and `serde_json` directly — a transitive
# dependency is not in the extern prelude. `diagnostics.rs` rounds with
# `jiff::TimestampRound` (`clock.rs` did too, until 005 lifted it to stratum
# 2); `view_model.rs`'s `Undrawn`/`Stimulus::event` path and
# `tests/support/driving.rs` (included into `renderer`) need `serde_json`.
# Both are already in `[workspace.dependencies]` for other members, so this
# adds nothing to the graph (design.md §5.1, F-4).
[dependencies]
goad-semantics = { workspace = true }
goad-shell     = { workspace = true }
jiff           = { workspace = true }
serde_json     = { workspace = true }
slint          = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "sync"] }

[dev-dependencies]
slint                   = { workspace = true, features = ["system-testing"] }
i-slint-backend-testing = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[lints]
workspace = true

[[test]]
name = "renderer"
path = "tests/renderer/main.rs"

[[test]]
name = "event_loop"
path = "tests/event_loop/main.rs"

[[test]]
name = "event_loop_schedule"
path = "tests/event_loop_schedule/main.rs"

[[test]]
name = "prototype"
path = "tests/prototype/main.rs"

[[test]]
name = "event_loop_debounce"
path = "tests/event_loop_debounce/main.rs"
