# `command` and the socket are relative to this file's directory, wherever
# goad or goad-check is started.
[backend]
command = ["bash", "backend.sh"]
timeout = "30s"

[schedule]
default_poll = "30m"

# Where a running goad listens for events, for watch.sh and goad-emit.
[ingress]
path = "./goad.sock"
