# Standalone: an empty `[workspace]` keeps this package out of goad's
# workspace, so it is not a member, `goad-boundary` never scans it, and
# `just check` does not build it.
[workspace]

[package]
name = "spike-fields"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
slint = "=1.17.1"

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
i-slint-backend-testing = "=1.17.1"

[[bin]]
name = "spike-fields"
path = "src/main.rs"

[lib]
name = "spike_lib"
path = "src/lib.rs"
